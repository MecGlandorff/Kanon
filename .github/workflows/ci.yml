name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Full SHA of the clean candidate commit
        required: true
        type: string
      candidate_version:
        description: Exact package/runtime version
        required: true
        type: string
      expected_artifact_sha256:
        description: Precomputed SHA-256 of the one packed tarball
        required: true
        type: string
      release_kind:
        description: Exact non-interchangeable assurance lane
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
          - maintainer-stable
      expected_signed_waiver_sha256:
        description: Required exact commitment only for maintainer-stable
        required: false
        type: string
      expected_maintainer_certification_sha256:
        description: Required exact commitment only for maintainer-stable
        required: false
        type: string
      expected_corpus_sha256:
        description: Required frozen holdout SHA-256 for stable releases
        required: false
        type: string
      publish:
        description: Publish the validated tarball and create its tag
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - publish

permissions:
  contents: read

env:
  CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_commit || github.sha }}

jobs:
  test:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 20
          - 22
          - 24
          - 25

    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify generated skill
        run: npm run check:skill

      - name: Run mandatory validation matrix
        run: npm run validate

      - name: Check whitespace
        run: git diff --check

      - name: Confirm validation did not modify tracked files
        run: git diff --exit-code

  pack-candidate:
    name: Pack candidate exactly once
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify candidate identity and cleanliness
        run: node scripts/check-candidate.js
        env:
          KANON_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          KANON_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          KANON_RELEASE_KIND: ${{ inputs.release_kind }}
          KANON_EXPECTED_CORPUS_SHA256: ${{ inputs.expected_corpus_sha256 }}
          KANON_SIGNED_WAIVER_SHA256: ${{ inputs.expected_signed_waiver_sha256 }}
          KANON_MAINTAINER_CERTIFICATION_SHA256: ${{ inputs.expected_maintainer_certification_sha256 }}

      - name: Install and validate candidate
        run: |
          npm ci --ignore-scripts
          npm run check:skill
          git diff --check
          git diff --exit-code

      - name: Build explicit allowlist staging
        run: npm run build:package

      - name: Pack once
        run: |
          mkdir -p dist/artifact
          npm pack ./dist/npm --pack-destination ./dist/artifact

      - name: Bind expected artifact hash and checksum
        id: artifact
        run: >-
          node scripts/ci-artifact.js stamp
          --directory dist/artifact
          --expected-sha256 "${{ inputs.expected_artifact_sha256 }}"

      - name: Attest exact candidate tarball
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.artifact.outputs.tarball }}

      - name: Exercise Ubuntu artifact
        run: >-
          node scripts/ci-artifact.js conform
          --directory dist/artifact
          --candidate-commit "${{ inputs.candidate_commit }}"
          --candidate-version "${{ inputs.candidate_version }}"
          --output dist/artifact/conformance-ubuntu.json

      - name: Upload exact candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-candidate-${{ inputs.candidate_commit }}
          path: dist/artifact/
          if-no-files-found: error
          retention-days: 30

  cross-platform-conformance:
    name: Conform ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    needs: pack-candidate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-candidate-${{ inputs.candidate_commit }}
          path: dist/artifact

      - name: Verify downloaded hash
        run: >-
          node scripts/ci-artifact.js verify
          --directory dist/artifact
          --expected-sha256 "${{ inputs.expected_artifact_sha256 }}"

      - name: Exercise installed wrappers and writes
        run: >-
          node scripts/ci-artifact.js conform
          --directory dist/artifact
          --candidate-commit "${{ inputs.candidate_commit }}"
          --candidate-version "${{ inputs.candidate_version }}"
          --output "conformance-${{ runner.os }}.json"

      - name: Upload platform conformance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-conformance-${{ runner.os }}
          path: conformance-${{ runner.os }}.json
          if-no-files-found: error
          retention-days: 30

  development-eval:
    name: Complete visible development corpus
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_kind != 'maintainer-stable'
    needs: pack-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Restore revision-bound analysis trees
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/kanon-development-corpus-v2
          key: kanon-development-v2-${{ hashFiles('eval/corpus.json') }}

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run every development case
        shell: bash
        run: |
          set +e
          npm run eval:dev -- \
            --cache "${{ runner.temp }}/kanon-development-corpus-v2" \
            --json-output development-eval.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi

      - name: Require complete error-free development execution
        run: >-
          node scripts/check-development-report.js
          --input development-eval.json
          --candidate-commit "${{ inputs.candidate_commit }}"
          --candidate-version "${{ inputs.candidate_version }}"
          ${{ inputs.release_kind != 'prerelease' && '--require-threshold-pass' || '' }}

      - name: Upload raw development report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-development-eval
          path: development-eval.json
          if-no-files-found: error
          retention-days: 30

  maintainer-stable-evidence:
    name: Bind frozen maintainer-stable evidence
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_kind == 'maintainer-stable'
    needs: pack-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact candidate with frozen history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate exact frozen evidence without corpus execution
        run: >-
          node scripts/check-maintainer-evidence.js
          --output maintainer-evidence-binding.json

      - name: Upload exact frozen evidence binding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-maintainer-evidence-${{ inputs.candidate_commit }}
          path: maintainer-evidence-binding.json
          if-no-files-found: error
          retention-days: 90

  release-eval:
    name: One-shot sealed holdout
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release_kind == 'stable'
    needs:
      - pack-candidate
      - cross-platform-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out post-freeze release records
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require frozen holdout hash
        run: node -e "if (!/^[0-9a-f]{64}$/.test(process.env.SHA || '')) throw new Error('Stable release requires expected_corpus_sha256')"
        env:
          SHA: ${{ inputs.expected_corpus_sha256 }}

      - name: Download exact candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-candidate-${{ inputs.candidate_commit }}
          path: dist/artifact

      - name: Verify and install exact artifact
        id: installed
        run: |
          node scripts/ci-artifact.js verify --directory dist/artifact --expected-sha256 "${{ inputs.expected_artifact_sha256 }}"
          node scripts/ci-artifact.js conform --directory dist/artifact --candidate-commit "${{ inputs.candidate_commit }}" --candidate-version "${{ inputs.candidate_version }}" --output conformance-release-eval.json

      - name: Install release harness
        run: npm ci --ignore-scripts

      - name: Run every sealed case through installed artifact
        run: >-
          npm run eval:release --
          --expected-corpus-sha256 "${{ inputs.expected_corpus_sha256 }}"
          --artifact-tarball "${{ steps.installed.outputs.tarball }}"
          --artifact-root "${{ steps.installed.outputs.package_root }}"
          --conformance-report "${{ steps.installed.outputs.conformance_report }}"
          --cache "${{ runner.temp }}/kanon-release-corpus-v2"
          --json-output release-eval.json

      - name: Upload raw held-out report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-release-eval
          path: |
            release-eval.json
            conformance-release-eval.json
          if-no-files-found: error
          retention-days: 90

  release-gate:
    name: Bind candidate, reports, and tarball
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.pack-candidate.result == 'success' &&
      needs.cross-platform-conformance.result == 'success' &&
      (
        ((inputs.release_kind == 'prerelease' || inputs.release_kind == 'stable') && needs.development-eval.result == 'success' && needs.maintainer-stable-evidence.result == 'skipped') ||
        (inputs.release_kind == 'maintainer-stable' && needs.development-eval.result == 'skipped' && needs.maintainer-stable-evidence.result == 'success')
      ) &&
      (
        ((inputs.release_kind == 'prerelease' || inputs.release_kind == 'maintainer-stable') && needs.release-eval.result == 'skipped') ||
        (inputs.release_kind == 'stable' && needs.release-eval.result == 'success')
      )
    needs:
      - pack-candidate
      - cross-platform-conformance
      - development-eval
      - maintainer-stable-evidence
      - release-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-candidate-${{ inputs.candidate_commit }}
          path: release-bundle

      - name: Download Windows conformance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-conformance-Windows
          path: release-bundle

      - name: Download macOS conformance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-conformance-macOS
          path: release-bundle

      - name: Download development report
        if: inputs.release_kind != 'maintainer-stable'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-development-eval
          path: release-bundle

      - name: Download frozen maintainer evidence binding
        if: inputs.release_kind == 'maintainer-stable'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-maintainer-evidence-${{ inputs.candidate_commit }}
          path: release-bundle

      - name: Download held-out report
        if: inputs.release_kind == 'stable'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-release-eval
          path: release-bundle

      - name: Create exact release binding
        run: >-
          node scripts/release-bind.js
          --bundle release-bundle
          --candidate-commit "${{ inputs.candidate_commit }}"
          --candidate-version "${{ inputs.candidate_version }}"
          --artifact-sha256 "${{ inputs.expected_artifact_sha256 }}"
          --release-kind "${{ inputs.release_kind }}"
        env:
          KANON_EXPECTED_CORPUS_SHA256: ${{ inputs.expected_corpus_sha256 }}
          KANON_SIGNED_WAIVER_SHA256: ${{ inputs.expected_signed_waiver_sha256 }}
          KANON_MAINTAINER_CERTIFICATION_SHA256: ${{ inputs.expected_maintainer_certification_sha256 }}

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kanon-release-bundle-${{ inputs.candidate_version }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Protected trusted publication
    # Prerelease and maintainer-stable intentionally skip release-eval.
    # Override implicit success() propagation, then require the gate explicitly.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == 'publish' &&
      needs.release-gate.result == 'success'
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node and npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Reverify protected publication identity
        run: node scripts/check-candidate.js
        env:
          KANON_CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          KANON_CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          KANON_RELEASE_KIND: ${{ inputs.release_kind }}
          KANON_EXPECTED_CORPUS_SHA256: ${{ inputs.expected_corpus_sha256 }}
          KANON_SIGNED_WAIVER_SHA256: ${{ inputs.expected_signed_waiver_sha256 }}
          KANON_MAINTAINER_CERTIFICATION_SHA256: ${{ inputs.expected_maintainer_certification_sha256 }}
          KANON_PUBLICATION_MODE: publish
          KANON_PROTECTED_ENVIRONMENT: npm-publish

      - name: Download immutable release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kanon-release-bundle-${{ inputs.candidate_version }}
          path: release-bundle

      - name: Reverify exact tarball
        id: artifact
        run: >-
          node scripts/ci-artifact.js verify
          --directory release-bundle
          --expected-sha256 "${{ inputs.expected_artifact_sha256 }}"

      - name: Publish unchanged tarball with OIDC provenance
        run: npm publish "${{ steps.artifact.outputs.tarball }}" --access public --tag latest

      - name: Create candidate-bound tag
        run: >-
          gh api "repos/${{ github.repository }}/git/refs"
          --method POST
          -f ref="refs/tags/v${{ inputs.candidate_version }}"
          -f sha="${{ inputs.candidate_commit }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create patched GitHub prerelease
        if: inputs.release_kind == 'prerelease'
        run: >-
          gh release create "v${{ inputs.candidate_version }}"
          "${{ steps.artifact.outputs.tarball }}"
          "${{ steps.artifact.outputs.tarball }}.sha256"
          --repo "${{ github.repository }}"
          --verify-tag
          --prerelease
          --title "Kanon v${{ inputs.candidate_version }}"
          --notes "Patched trust-repair prerelease. Public scope is limited to brief, verify, resume, refresh, todo, and narrowly scoped ask. Repository content is treated as untrusted data, declared commands require approval, and no held-out capability estimate is claimed for this prerelease. See CHANGELOG.md and the attached checksum."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create stable GitHub release from certified artifact
        if: inputs.release_kind == 'stable' || inputs.release_kind == 'maintainer-stable'
        run: >-
          gh release create "v${{ inputs.candidate_version }}"
          "${{ steps.artifact.outputs.tarball }}"
          "${{ steps.artifact.outputs.tarball }}.sha256"
          --repo "${{ github.repository }}"
          --verify-tag
          --title "Kanon v${{ inputs.candidate_version }}"
          --notes-file docs/releases/v1.0.0.md
        env:
          GH_TOKEN: ${{ github.token }}
